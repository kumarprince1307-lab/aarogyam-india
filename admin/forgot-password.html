<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password - Aarogyam India Admin</title>
  <link rel="stylesheet" href="../css/admin-panel.css">
  <link rel="stylesheet" href="../css/admin-components.css">
</head>
<body>
  <div class="admin-auth-screen">
    <div class="admin-auth-card">
      <h1>Forgot Password</h1>
      <p>Enter your email address to receive password recovery instructions. This is a Phase-1 UI placeholder only.</p>
      <form class="admin-auth-form" onsubmit="event.preventDefault(); window.location.href='login.html';">
        <input type="email" class="admin-input" placeholder="Admin email" required>
        <button class="admin-button" type="submit">Send recovery link</button>
      </form>
      <div class="admin-auth-footer">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </div>
  <script type="module" src="../js/admin-main.js"></script>
</body>
</html>
