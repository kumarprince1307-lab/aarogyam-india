<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - All Survey Records & Leads (सर्वे एवं लीड्स डायरेक्टरी)</title>
  
  <link rel="icon" type="image/png" href="../images/logo/fevicon.png">
  <link rel="apple-touch-icon" href="../images/logo/fevicon.png">
  <link rel="manifest" href="admin-manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Security Check -->
  <script>
    const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || window.location.protocol === 'file:';
    if (isLocal && !localStorage.getItem('admin_session')) {
      localStorage.setItem('admin_session', 'true');
    }
    const adminSession = localStorage.getItem('admin_session');
    if (!adminSession && !isLocal) {
      window.location.replace('login.html');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-panel.css?v=41.0">
  <link rel="stylesheet" href="../css/admin-components.css?v=41.0">
</head>
<body>
  <div id="admin-app" class="admin-app">
    <div id="sidebar-placeholder"></div>
    <div id="sidebar-backdrop"></div>
    <div id="main-area" class="admin-main">
      <div id="header-placeholder"></div>
      <div style="height:8px"></div>
      <div id="page-content" class="admin-container">
        <div class="admin-loading">सर्वे व लीड्स रिकॉर्ड्स लोड हो रहे हैं...</div>
      </div>
      <footer id="admin-footer" class="admin-card" style="margin:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>© 2026 Aarogyam India</div>
          <div class="admin-muted">Admin Panel — Survey & Lead Hub</div>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/admin-main.js?v=42.0"></script>
</body>
</html>
