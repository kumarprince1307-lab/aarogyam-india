<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login - Aarogyam India</title>
  <link rel="stylesheet" href="../css/admin-login.css">
</head>
<body>
  <div class="admin-auth-screen">
    <div class="admin-auth-card">
      <h1>Admin Login</h1>
      <p>Enter your admin credentials to access the dashboard.</p>
      <form id="admin-login-form" class="admin-auth-form">
        <input type="text" id="admin-username" class="admin-input" placeholder="Username" required>
        <input type="password" id="admin-password" class="admin-input" placeholder="Password" required>
        <button class="admin-button" type="submit">Login</button>
      </form>
    </div>
  </div>
  <script src="../js/admin-login.js"></script>
</body>
</html>
