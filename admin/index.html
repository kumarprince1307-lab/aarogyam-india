<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel - Aarogyam India (V1)</title>
  
  <!-- Security Check: अगर बिना लॉगिन सीधे लिंक खोला, तो तुरंत login.html पर भेज देगा -->
  <script>
    const adminSession = localStorage.getItem('admin_session');
    if (!adminSession) {
      window.location.replace('login.html');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-panel.css?v=2.0">
  <link rel="stylesheet" href="../css/admin-components.css?v=2.0">
</head>
<body>
  <div id="admin-app" class="admin-app">
    <div id="sidebar-placeholder"></div>
    <div id="sidebar-backdrop"></div>
    <div id="main-area" class="admin-main">
      <div id="header-placeholder"></div>

      <!-- Page heading is rendered inside header for a compact, consistent layout -->
      <div style="height:8px"></div>

      <div id="page-content" class="admin-container">
        <!-- Page content will be rendered here by admin page modules -->
      </div>

      <footer id="admin-footer" class="admin-card" style="margin:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>© 2026 Aarogyam India</div>
          <div class="admin-muted">Admin Panel V1 — UI only</div>
        </div>
      </footer>
    </div>
  </div>

  <!-- 1. Supabase Official SDK CDN (यह सबसे पहले लोड होना जरूरी है) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Admin Main Module Script -->
  <script type="module" src="../js/admin-main.js?v=2.0"></script>

</body>

</html>
