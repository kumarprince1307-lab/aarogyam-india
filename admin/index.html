<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aarogyam India Admin</title>
  
  <!-- Official Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="../images/logo/fevicon.png">
  <link rel="apple-touch-icon" href="../images/logo/fevicon.png">
  <link rel="manifest" href="admin-manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Admin">

  <!-- Security & Cache Sync -->
  <script>
    const adminSession = localStorage.getItem('admin_session');
    if (!adminSession) {
      window.location.replace('login.html');
    }
    // Force immediate Service Worker and Cache update
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          if (k !== 'aarogyam-admin-shell-v31') caches.delete(k);
        });
      });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.update());
      });
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-panel.css?v=8.5">
  <link rel="stylesheet" href="../css/admin-components.css?v=8.5">
</head>
<body>
  <div id="admin-app" class="admin-app">
    <div id="sidebar-placeholder"></div>
    <div id="sidebar-backdrop"></div>
    <div id="main-area" class="admin-main">
      <div id="header-placeholder"></div>

      <!-- Page heading is rendered inside header for a compact, consistent layout -->
      <div style="height:8px"></div>

      <div id="page-content" class="admin-container">
        <!-- Page content will be rendered here by admin page modules -->
      </div>

      <footer id="admin-footer" class="admin-card" style="margin:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>© 2026 Aarogyam India</div>
          <div class="admin-muted">Admin Panel V1 — UI only</div>
        </div>
      </footer>
    </div>
  </div>

  <!-- 1. Supabase Official SDK CDN (यह सबसे पहले लोड होना जरूरी है) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Admin Main Module Script -->
  <script type="module" src="../js/admin-main.js?v=31.0"></script>

</body>

</html>
