<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आप ऑफ़लाइन हैं | Aarogyam India</title>
  <link rel="icon" type="image/png" href="/images/logo/fevicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .offline-logo {
      height: 48px;
      margin-bottom: 20px;
      object-fit: contain;
    }
    .offline-icon {
      font-size: 3.5rem;
      margin-bottom: 14px;
    }
    .offline-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 10px 0;
    }
    .offline-desc {
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-offline-primary {
      background: #28a745;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-offline-primary:hover {
      background: #218838;
    }
    .btn-offline-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/images/logo/logo.png" alt="Aarogyam India" class="offline-logo">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">आप अभी Offline हैं</h1>
    <p class="offline-desc">
      इंटरनेट कनेक्शन उपलब्ध नहीं है। पहले से विज़िट किए गए पेजेज़ और सुरक्षित App Shell उपलब्ध हैं। Internet connection वापस आने पर लाइव डेटा और नया सिंक स्वतः अपडेट हो जाएगा।
    </p>
    <div class="offline-actions">
      <button class="btn-offline-primary" onclick="window.location.reload();">
        🔄 पुनः प्रयास करें (Try Again)
      </button>
      <a href="/index.html" class="btn-offline-secondary">
        🏠 Home Page
      </a>
      <a href="/ebooks/my-library.html" class="btn-offline-secondary">
        📚 My Library
      </a>
    </div>
  </div>
</body>
</html>
