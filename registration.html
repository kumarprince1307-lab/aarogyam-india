<!DOCTYPE html>
<html lang="en">
<head>

    <!-- SEO + Google Analytics (AIM Rule) -->

    <title>Free Registration | Aarogyam India</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Free Registration for Aarogyam India">

    <link rel="stylesheet"
          href="css/registration.css">

</head>

<body>

<header class="top-bar">

    <button
        id="backBtn"
        type="button">
        ← Back
    </button>

</header>

<main class="registration-page">

    <section class="register-card">

        <img
            src="images/logo/logo.png"
            alt="Aarogyam India"
            class="logo">

        <h1 id="authTitle">Free Registration</h1>

        <p id="authSubtitle">
            Register once and access Demo Books,
            eBooks and My Library.
        </p>

        <!-- Auth Mode Toggle Tabs -->
        <div class="auth-tabs" style="display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 16px;">
            <button type="button" id="tabRegisterBtn" style="flex: 1; padding: 10px 8px; border: none; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; background: #169c55; color: #fff; transition: all 0.2s;">
                रजिस्ट्रेशन (Sign Up)
            </button>
            <button type="button" id="tabLoginBtn" style="flex: 1; padding: 10px 8px; border: none; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; background: transparent; color: #475569; transition: all 0.2s;">
                लॉगिन (Login)
            </button>
        </div>

        <!-- 1. Registration Form -->
        <form id="registrationForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name *
                </label>

                <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    autocomplete="name"
                    required>

            </div>

            <div class="form-group">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    id="mobile"
                    name="mobile"
                    type="tel"
                    maxlength="10"
                    inputmode="numeric"
                    required>

            </div>

            <div class="form-group">

                <label for="email">
                    Email (Optional)
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email">

            </div>

            <div class="form-group">

                <label for="referralMobile">
                    Referral Mobile (Optional)
                </label>

                <input
                    id="referralMobile"
                    name="referralMobile"
                    type="tel"
                    maxlength="10"
                    inputmode="numeric">

            </div>

            <label class="terms">

                <input
                    id="agreeTerms"
                    type="checkbox"
                    required>

                <span>
                    I agree to the
                    Terms & Privacy Policy
                </span>

            </label>

            <button
                id="registerBtn"
                type="submit">

                CREATE FREE ACCOUNT

            </button>

            <div style="text-align: center; margin-top: 14px; font-size: 13px; color: #64748b;">
                पहले से अकाउंट है? <a href="#" id="switchLoginLink" style="color: #1E40AF; font-weight: 700; text-decoration: none;">यहाँ लॉगिन करें</a>
            </div>

        </form>

        <!-- 2. Quick Login Form -->
        <form id="quickLoginForm" style="display: none;">

            <div class="form-group">
                <label for="loginMobileInput">
                    Mobile Number (10 डिजिट मोबाइल नंबर) *
                </label>
                <input
                    id="loginMobileInput"
                    name="loginMobile"
                    type="tel"
                    maxlength="10"
                    placeholder="उदा. 9876543210"
                    inputmode="numeric"
                    required>
            </div>

            <button
                id="quickLoginSubmitBtn"
                type="submit"
                style="width:100%; height:48px; border:none; border-radius:12px; background:#1E40AF; color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top: 6px;">
                लॉगिन करें (LOGIN)
            </button>

            <div style="text-align: center; margin-top: 14px; font-size: 13px; color: #64748b;">
                नया अकाउंट बनाना है? <a href="#" id="switchRegisterLink" style="color: #169c55; font-weight: 700; text-decoration: none;">यहाँ रजिस्ट्रेशन करें</a>
            </div>

        </form>

        <p
            id="formMessage"
            class="form-message">
        </p>

    </section>

</main>
<!-- 1. सबसे पहले Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. डेटाबेस कनेक्शन फाइल -->
<script src="js/supabase.js?v=2.2.0"></script>

<!-- 3. मास्टर सेशन फाइल (ताकि लैंडिंग पेज और सोर्स सबसे पहले कैप्चर हो) -->
<script src="session.js?v=2.2.0"></script>

<!-- 4. सबसे आखिर में रजिस्ट्रेशन फाइल -->
<script src="js/registration.js?v=2.2.0"></script>

</body>
</html>
