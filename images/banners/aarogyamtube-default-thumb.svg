<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#131E36"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8CFF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#2D8CFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Circles -->
  <circle cx="360" cy="540" r="320" fill="none" stroke="rgba(45, 140, 255, 0.12)" stroke-width="2"/>
  <circle cx="360" cy="540" r="220" fill="none" stroke="rgba(244, 63, 94, 0.15)" stroke-width="2"/>

  <!-- Logo Top -->
  <g transform="translate(360, 180)" text-anchor="middle">
    <circle cx="0" cy="0" r="60" fill="#1E293B" stroke="url(#glowGrad)" stroke-width="4" filter="url(#shadow)"/>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#2D8CFF">A</text>
    <text x="0" y="90" font-family="'Noto Sans Devanagari', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">आरोग्यम इंडिया</text>
    <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#94A3B8" letter-spacing="3">AAROGYAM TUBE</text>
  </g>

  <!-- Central Play Emblem -->
  <g transform="translate(360, 560)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="95" fill="url(#btnGrad)"/>
    <polygon points="-25,-40 45,0 -25,40" fill="#FFFFFF"/>
  </g>

  <!-- Content Banner Bottom -->
  <g transform="translate(360, 840)" text-anchor="middle">
    <rect x="-260" y="0" width="520" height="120" rx="20" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(45, 140, 255, 0.35)" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="45" font-family="'Noto Sans Devanagari', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">कृषि एवं जैविक खेती रील्स</text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#38BDF8">1-Minute Practical Masterclass</text>
  </g>

  <!-- Social Icons Badge Bottom -->
  <g transform="translate(360, 1080)" text-anchor="middle">
    <rect x="-200" y="0" width="400" height="60" rx="30" fill="#0B1120" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="0" y="38" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="700" fill="#94A3B8">🔴 YouTube • 📷 Insta • 📘 FB</text>
  </g>
</svg>
